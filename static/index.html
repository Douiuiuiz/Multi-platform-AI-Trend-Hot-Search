<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AI 趋势热榜 — 实时热点追踪</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<div class="app">
  <!-- ── Sidebar ─────────────────────────── -->
  <aside class="sidebar" id="sidebar">
    <div class="sidebar-top">
      <div class="brand">
        <div class="brand-mark">AI</div>
        <div class="brand-text">
          <span class="brand-name">AI 趋势热榜</span>
          <span class="brand-ver">v2.0</span>
        </div>
      </div>

      <nav class="nav">
        <button class="nav-item active" data-view="trends">
          <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/></svg>
          <span class="nav-label">实时热榜</span>
        </button>
        <button class="nav-item" data-tab="bilibili">
          <span class="nav-dot bili"></span>
          <span class="nav-label">B站热搜</span>
          <span class="nav-badge" id="navBadge-bilibili"></span>
        </button>
        <button class="nav-item" data-tab="weibo">
          <span class="nav-dot weibo"></span>
          <span class="nav-label">微博热搜</span>
          <span class="nav-badge" id="navBadge-weibo"></span>
        </button>
        <button class="nav-item" data-tab="douyin">
          <span class="nav-dot douyin"></span>
          <span class="nav-label">抖音趋势</span>
          <span class="nav-badge" id="navBadge-douyin"></span>
        </button>
      </nav>
    </div>

    <div class="sidebar-card">
      <h3>✦ AI 热点追踪</h3>
      <p>聚合三大平台实时热榜，智能识别 AI 相关话题，帮你先人一步发现趋势。</p>
      <div class="sidebar-card-glow"></div>
    </div>
  </aside>

  <!-- ── Main Content ──────────────────────── -->
  <main class="main">
    <!-- Header -->
    <header class="topbar">
      <div class="topbar-left">
        <h1>实时<span class="gradient-text">热点</span>追踪</h1>
        <p class="topbar-sub">B站 · 微博 · 抖音 — AI 领域智能筛选</p>
      </div>
      <div class="topbar-right">
        <div class="live-pill" id="livePill">
          <span class="pulse-dot live"></span>
          <span id="liveText">实时监控中</span>
        </div>
        <span class="update-time">更新于 <time id="lastUpdated">--:--:--</time></span>
      </div>
    </header>

    <!-- Toolbar -->
    <section class="toolbar">
      <div class="toolbar-search">
        <svg class="search-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        <input type="text" id="searchInput" placeholder="搜索关键词（如 GPT-5、Sora、DeepSeek…）" autocomplete="off">
        <kbd>⌘K</kbd>
      </div>
      <label class="toolbar-select">
        <select id="filterSelect">
          <option value="ai">🔍 只看 AI 相关</option>
          <option value="all">📋 查看全部热点</option>
          <option value="tier1">⭐ 高相关（Tier 1）</option>
        </select>
        <svg class="select-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
      </label>
      <button class="toolbar-btn" id="refreshBtn">
        <svg class="btn-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/></svg>
        <span>刷新</span>
      </button>
    </section>

    <!-- Cards Grid -->
    <section class="cards-grid" id="cardsGrid">
      <!-- Populated by JS -->
    </section>

    <!-- Analysis Row -->
    <section class="analysis-row">
      <div class="analysis-card">
        <div class="analysis-head">
          <span class="analysis-icon">⌁</span>
          <h3>AI 热度分布</h3>
        </div>
        <div class="platform-stats" id="platformStats">
          <div class="stat-bar-wrap">
            <div class="stat-bar-label"><span class="stat-dot bili"></span> B站</div>
            <div class="stat-bar-track"><div class="stat-bar-fill bili-fill" id="statBili"></div></div>
            <span class="stat-value" id="statBiliVal">0</span>
          </div>
          <div class="stat-bar-wrap">
            <div class="stat-bar-label"><span class="stat-dot weibo"></span> 微博</div>
            <div class="stat-bar-track"><div class="stat-bar-fill weibo-fill" id="statWeibo"></div></div>
            <span class="stat-value" id="statWeiboVal">0</span>
          </div>
          <div class="stat-bar-wrap">
            <div class="stat-bar-label"><span class="stat-dot douyin"></span> 抖音</div>
            <div class="stat-bar-track"><div class="stat-bar-fill douyin-fill" id="statDouyin"></div></div>
            <span class="stat-value" id="statDouyinVal">0</span>
          </div>
        </div>
      </div>
      <div class="analysis-card">
        <div class="analysis-head">
          <span class="analysis-icon">#</span>
          <h3>热门 AI 关键词</h3>
        </div>
        <div class="keyword-cloud" id="keywordCloud"></div>
      </div>
    </section>
  </main>
</div>

<!-- Toast -->
<div class="toast" id="toast">✓ 已刷新最新热点</div>

<script src="js/app.js"></script>
</body>
</html>
